# pnpm 11 project config.
#
# pnpm 11 removed `onlyBuiltDependencies` (and friends) and replaced them with
# `allowBuilds`. `strictDepBuilds` defaults to `true`, so `pnpm install` exits
# non-zero when a dependency's build script is not explicitly allowed. Listing
# the known build-script deps here keeps `pnpm install` green in CI.
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
