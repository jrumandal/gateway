name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4

      - name: Checkout server-shared (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/server-shared
          path: ../server-shared

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          runInstall: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Link server-shared into a workspace
        run: |
          cd ..
          printf 'packages:\n  - server-shared\n  - gateway\n' > pnpm-workspace.yaml
          printf '{"name":"mf-ci","private":true,"packageManager":"pnpm@11.24.0","pnpm":{"onlyBuiltDependencies":["@prisma/client","@prisma/engines","prisma","@nestjs/core"]}}\n' > package.json
          cd gateway

      - name: Install
        run: pnpm install

      - name: Build server-shared (Prisma generate + tsc)
        run: |
          cd ../server-shared
          pnpm prisma:generate
          pnpm build
          cd ../gateway

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
