name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v4
        with:
          repository: jrumandal/gateway
          path: gateway

      - name: Checkout server-shared (sibling workspace)
        uses: actions/checkout@v4
        with:
          repository: jrumandal/server-shared
          path: server-shared

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Link sibling into a workspace
        run: |
          cat > pnpm-workspace.yaml <<'WSPEOF'
          packages:
            - "gateway"
            - "server-shared"
          allowBuilds:
            '@apollo/protobufjs': true
            '@nestjs/core': true
            '@parcel/watcher': true
            '@prisma/client': true
            '@prisma/engines': true
            '@scarf/scarf': true
            esbuild: true
            lmdb: true
            msgpackr-extract: true
            prisma: true
            unrs-resolver: true
          WSPEOF
          printf '{\n  "name": "mf-workspace",\n  "private": true\n}\n' > package.json

      - name: Install
        run: pnpm install

      - name: Build server-shared (prisma generate + tsc)
        working-directory: server-shared
        run: pnpm prisma:generate && pnpm build

      - name: Lint
        working-directory: gateway
        run: pnpm lint

      - name: Typecheck
        working-directory: gateway
        run: pnpm typecheck

      - name: Test
        working-directory: gateway
        run: pnpm test

      - name: Build
        working-directory: gateway
        run: pnpm build
